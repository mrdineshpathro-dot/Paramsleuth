[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paramscout"
version = "0.1.0"
description = "Passive-first URL parameter discovery, evidence-based validation and prioritisation for explicitly authorized targets."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ParamScout contributors" }]
keywords = [
  "security",
  "bug-bounty",
  "reconnaissance",
  "url-parameters",
  "cli",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<0.29",
  "beautifulsoup4>=4.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "mypy>=1.8",
  "ruff>=0.4",
]

[project.scripts]
paramscout = "paramscout.cli:main"

[project.urls]
Homepage = "https://github.com/mrdineshpathro-dot/Paramsleuth"

[tool.setuptools.packages.find]
include = ["paramscout*"]

[tool.setuptools.package-data]
paramscout = ["py.typed", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore:It looks like you're using an HTML parser to parse an XML document:UserWarning",
]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = false
ignore_missing_imports = true
check_untyped_defs = false

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# A deliberate, reproducible rule set: correctness (F), pyflakes-adjacent style
# (E/W), import order (I), bug-prone patterns (B), modernisation (UP) and a few
# simplifications (SIM). Preview/experimental families are not enabled.
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
  "E501",   # line length is handled by the formatter
  "SIM102", # nested ifs are occasionally clearer than one boolean expression
  "SIM103", # explicit return of a condition reads better in guards
  "SIM105", # contextlib.suppress is not always clearer
]
